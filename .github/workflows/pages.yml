# Builds the site from the sources, checks it (completeness, links, no cookies/storage/forms, no external requests)
# and publishes dist/ to GitHub Pages. A failed check stops the publication.
name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # daily in December and January: the holiday bar disappears after build.HOLIDAY_BAR_UNTIL by itself
    - cron: '17 4 * 12,1 *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.first_try.outputs.page_url || steps.second_try.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Pillow
        run: pip install pillow
      - name: Build
        run: python tools/build.py
      - name: Check
        run: python tools/check.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      # GitHub sometimes does not find the artifact it has just stored ("No artifacts named github-pages"): one more try
      - id: first_try
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Wait before the second try
        if: steps.first_try.outcome == 'failure'
        run: sleep 60
      - id: second_try
        if: steps.first_try.outcome == 'failure'
        uses: actions/deploy-pages@v4
